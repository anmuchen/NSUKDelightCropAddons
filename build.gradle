plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    flatDir { dirs 'libs' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ------------------------------------------------------------------
    // 宿主模组：New Sim U Kraft（simukraft）
    // 提供农田盒 / 雇佣农民工作循环，是本模组 mixin 注入的目标。
    // 未发布到任何公共 Maven，故以本地 jar 形式引入。
    // ------------------------------------------------------------------
    compileOnly files('libs/New-Sim-U-Kraft-2.2.0-neoforge-1.21.1.jar')
    localRuntime files('libs/New-Sim-U-Kraft-2.2.0-neoforge-1.21.1.jar')

    // ------------------------------------------------------------------
    // LDLib2：农田盒 GUI 所使用的界面工具库（随宿主模组分发）。
    // ------------------------------------------------------------------
    compileOnly files('libs/ldlib2-neoforge-1.21.1-2.2.40-all.jar')

    // LDLib2 内部 JarJar 嵌套库：Taffy（布局引擎）与 Yoga（样式模型），
    // 编译 GUI 屏幕类时需要它们的类型。
    compileOnly files('libs/taffy-1.1.4.jar')
    compileOnly files('libs/yoga-1.0.0.jar')

    // MixinExtras（@WrapMethod / Operation）由 NeoForge 21.1.x 隐式提供，
    // 无需显式声明；如需独立版本可在此追加：
    // compileOnly "io.github.llamalad7:mixinextras-neoforge:0.5.3"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
